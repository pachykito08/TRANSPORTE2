YAML
name: Actualizar GeoJSON Transporte La Plata

on:
  # Permite ejecutar el script manualmente desde la pestaña 'Actions'
  workflow_dispatch:
  # Se ejecuta automáticamente todos los días a las 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # OBLIGATORIO: Permite al bot hacer push del GeoJSON actualizado

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de extracción
        run: python script_transporte.py

      - name: Hacer Commit y Push del archivo GeoJSON actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add transporte_la_plata.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Ge
